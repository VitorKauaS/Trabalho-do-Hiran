<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imgs/favicon.ico" type="image/x-icon">
    <title>Login - Sistema de Licenças</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="cadastro-container">
        <div class="cadastro-card">
            <form id="formCadastro">         
                <div class="form-group">
                    <label for="Nome">Nome</label>
                    <input type="text" id="nome" name="pNome" placeholder="nome completo" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail (Login)</label>
                    <input type="email" id="email" name="pLogin" placeholder="seu@email.com" required>
                    <small id="emailError" class="error-message"></small>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="pSenha" placeholder="********" required>
                </div>
                
                <button type="submit" class="btn">Registrar</button>
                 <a href="login.html">Voltar pra o Login</a>
            </form>
        </div>
    </div>
    <div id="mensagem"></div>

    <script src="cadastro.js"></script>
</body>
</html>
